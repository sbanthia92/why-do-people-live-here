[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "why-do-people-live-here"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "asyncpg",
    "httpx",
    "tweepy",
    "python-dotenv",
    "pyyaml",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*", "scheduler*", "db*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

name: Daily post

on:
  schedule:
    - cron: "17 9 * * *"   # 09:17 UTC daily; off the hour, when scheduled runs queue longest
  workflow_dispatch:         # allow manual trigger
    inputs:
      posts:
        description: "Number of posts to produce"
        type: number
        default: 1

# Never let two runs pick the same candidate, or push state over each other
concurrency: daily-post

permissions:
  contents: write   # the run commits its state to the `data` branch
  issues: write     # previews are filed as issues

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Set the PUBLISH_TO_X repository variable to "true" to post for real.
      # Anything else means preview mode: nothing is sent to X.
      PUBLISH_TO_X: ${{ vars.PUBLISH_TO_X }}
      # Wikimedia asks for a real contact (email or URL) in the User-Agent.
      # Set the WIKIMEDIA_CONTACT repository variable; the repo URL is the fallback.
      WIKIMEDIA_USER_AGENT: whydopeoplelivehere/0.1 (${{ vars.WIKIMEDIA_CONTACT || format('https://github.com/{0}', github.repository) }})
      # "true" adds a link to the Wikipedia article in the closing reply. X charges far
      # more for a post containing a link, so the source is named in text by default.
      SOURCE_LINK: ${{ vars.SOURCE_LINK }}
      POSTS: ${{ inputs.posts || 1 }}
      PREVIEW_DIR: previews
      STATE_DIR: state

    steps:
      - uses: actions/checkout@v4

      - name: Decide what to run
        id: mode
        env:
          HAS_X_KEYS: ${{ secrets.X_API_KEY != '' && secrets.X_API_SECRET != '' && secrets.X_ACCESS_TOKEN != '' && secrets.X_ACCESS_SECRET != '' }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::The ANTHROPIC_API_KEY secret is not set, so there is nothing to run. Add it under Settings → Secrets and variables → Actions."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

          if [ "$PUBLISH_TO_X" = "true" ]; then
            if [ "$HAS_X_KEYS" != "true" ]; then
              echo "::error::PUBLISH_TO_X is on, but one or more of the X_API_KEY, X_API_SECRET, X_ACCESS_TOKEN and X_ACCESS_SECRET secrets is not set."
              exit 1
            fi
            echo "publish_flags=--publish --yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.11
        if: steps.mode.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.mode.outputs.run == 'true'
        run: pip install . pgserver

      # The pipeline's memory (what has been posted, rejected or queued) is kept as
      # files on the `data` branch. Each run loads them into a throwaway database,
      # does its work, and commits the result back.
      - name: Check out state
        if: steps.mode.outputs.run == 'true'
        run: |
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth 1 origin data
            git worktree add "$STATE_DIR" FETCH_HEAD
          else
            # First run: start an empty branch that shares no history with the code
            git worktree add --detach "$STATE_DIR"
            git -C "$STATE_DIR" checkout --orphan data
            git -C "$STATE_DIR" rm -rf --quiet . || true
          fi

      - name: Run pipeline
        if: steps.mode.outputs.run == 'true'
        run: python scripts/run_local.py --state-dir "$STATE_DIR" --posts "$POSTS" --parallel 1 ${{ steps.mode.outputs.publish_flags }}
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}

      # Runs even if the pipeline failed: a post may have gone out before the error,
      # and losing that record would mean posting the same place again.
      - name: Save state
        if: always() && steps.mode.outputs.run == 'true'
        run: |
          [ -d "$STATE_DIR" ] || exit 0
          cd "$STATE_DIR"
          git add -A
          if git diff --cached --quiet; then
            echo "State unchanged."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "State after run ${GITHUB_RUN_ID}"
          git push origin HEAD:data

      # Each preview becomes an issue assigned to the repository owner, which GitHub
      # emails to them, and is also shown on the run's summary page.
      - name: File previews as issues
        if: always() && steps.mode.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=("$PREVIEW_DIR"/*.md)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No previews were written." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh label create preview --color 0E8A16 --description "Dry-run post preview" --force
          for file in "${files[@]}"; do
            cat "$file" >> "$GITHUB_STEP_SUMMARY"
            title="$(head -n 1 "$file" | sed 's/^# //')"
            gh issue create \
              --title "Preview: $title" \
              --body-file "$file" \
              --label preview \
              --assignee "${{ github.repository_owner }}"
          done

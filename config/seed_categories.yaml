# Candidate sources per story_category.
#
#   categories: Wikipedia category slugs. Crawled one subcategory level deep.
#               Use these where Wikipedia's categories line up with the story type.
#   places:     Hand-picked English Wikipedia article titles (exact, post-redirect).
#               Use these where no good category exists (Wikipedia groups places by
#               location, not by remoteness or story).
#
# Every entry goes through the same layer 1 filter, dedup and scoring either way.
# After editing `places`, run:  python scripts/verify_seed_places.py


name: Daily post

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC daily
  workflow_dispatch:        # allow manual trigger
    inputs:
      dry_run:
        description: "Preview only — generate the post but do not publish to X"
        type: boolean
        default: false

# Never let two runs pick the same candidate
concurrency: daily-post

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    env:
      # A hosted Postgres that persists between runs. Dedup and variety tracking live
      # there, so a throwaway service container would reset them every day.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install .

      - name: Apply DB schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql

      - name: Run pipeline
        run: python -m scheduler.run_pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          # Wikimedia asks for a real contact (email or URL) in the User-Agent.
          # Set the WIKIMEDIA_CONTACT repository variable.
          WIKIMEDIA_USER_AGENT: whydopeoplelivehere/0.1 (${{ vars.WIKIMEDIA_CONTACT }})
          DRY_RUN: ${{ inputs.dry_run || 'false' }}

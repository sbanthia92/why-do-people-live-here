name: Weekly cost report

on:
  schedule:
    # Friday evening UTC, after the daily post has run, so the weekend is free to read it
    - cron: "47 18 * * 5"
  workflow_dispatch:         # allow manual trigger

permissions:
  contents: read
  issues: write     # the report is filed as an issue

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      STATE_DIR: state

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The costs are kept with the rest of the pipeline's memory on the `data` branch
      - name: Check out state
        id: state
        run: |
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth 1 origin data
            git worktree add "$STATE_DIR" FETCH_HEAD
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::There is no data branch yet, so there is nothing to report."
          fi

      - name: Build report
        if: steps.state.outputs.found == 'true'
        run: python scripts/cost_report.py --state-dir "$STATE_DIR" --days 7 > cost-report.md

      - name: File report as an issue
        if: steps.state.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat cost-report.md >> "$GITHUB_STEP_SUMMARY"
          gh label create cost-report --color FBCA04 --description "Weekly cost report" --force
          gh issue create \
            --title "$(head -n 1 cost-report.md | sed 's/^# //')" \
            --body-file cost-report.md \
            --label cost-report \
            --assignee "${{ github.repository_owner }}"
